# Blueprint do Render: cria o servidor web e o banco PostgreSQL.
# Valores sensíveis (sync: false) são pedidos na tela do Render e nunca ficam no repositório.
services:
  - type: web
    name: caixa-consolidado
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: caixa-db
          property: connectionString
      - key: CRON_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NOME
        sync: false
      - key: ADMIN_SENHA_INICIAL
        sync: false

databases:
  - name: caixa-db
    plan: free
    region: virginia
    databaseName: caixa
