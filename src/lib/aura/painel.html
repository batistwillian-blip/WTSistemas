<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Identidade Aura (roxo, verde-água, Plus Jakarta Sans) dentro do portal WT Sistemas. */
:root{--bg:#0D0820;--bg2:#120C29;--glass:#16102E;--glass2:#1E1640;--line:rgba(163,123,255,.16);--ink:#F3EEFF;--muted:#B3A9D6;--muted2:#8C82B3;--v:#6411E8;--v2:#A37BFF;--c:#A37BFF;--p:#19E0D0;--ok:#19E0D0;--warn:#FFB547;--bad:#FF7A96;--wt:#FF9A3D;--unifael:#8FA8FF;--cefe:#FFB547;--agtu:#FF7AB8}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.num{font-family:"Plus Jakarta Sans",system-ui,sans-serif}
.num,.mono{font-family:"JetBrains Mono",monospace}
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:12px 24px;background:rgba(18,12,41,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.orb{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--v);color:#fff;font-weight:800;font-size:19px}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}.brand small{color:var(--muted);font-size:12px}
.live{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:rgba(25,224,208,.1);border:1px solid rgba(25,224,208,.35);color:#5FF0E3;font-size:12px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--p);box-shadow:0 0 0 0 rgba(25,224,208,.7);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(25,224,208,0)}100%{box-shadow:0 0 0 0 rgba(25,224,208,0)}}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:#1A1238;border:1px solid var(--line)}
.seg button{border:0;background:transparent;color:#C9BFEA;padding:8px 14px;border-radius:10px;cursor:pointer;font:500 13px "Plus Jakarta Sans",sans-serif}
.seg button.on{background:var(--v);color:#fff;font-weight:700}
.perw{position:relative}.per-pop{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:60;background:#1A1238;border:1px solid var(--line);border-radius:14px;padding:12px;gap:10px;flex-wrap:wrap;align-items:flex-end;box-shadow:0 14px 40px rgba(0,0,0,.55);width:max-content;max-width:calc(100vw - 24px)}.per-pop.on{display:flex}.per-pop label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.per-pop input{background:#0D0820;color:#F3EEFF;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font:500 13px "Plus Jakarta Sans",sans-serif;color-scheme:dark}.per-pop button{border:0;background:var(--v);color:#fff;border-radius:10px;padding:9px 16px;font:700 13px "Plus Jakarta Sans",sans-serif;cursor:pointer}.per-pop p{flex-basis:100%;margin:0;color:#FFB3C2;font-size:12px}.per-pop p:empty{display:none}
@media(max-width:700px){.per-pop{right:auto;left:0}}
.wtby{font-size:11px;color:var(--muted2)}.wtby b{color:var(--wt)}
main{max-width:1440px;margin:0 auto;padding:22px 24px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;position:relative}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:18px 20px;position:relative;overflow:hidden}
.card h2{font-size:15px;margin:0 0 14px;color:var(--ink);font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 small{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted)}
.insts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.insts button{height:44px;padding:0 16px;border-radius:12px;border:1px solid rgba(163,123,255,.2);background:var(--glass);color:var(--ink);font:600 14px "Plus Jakarta Sans",sans-serif;display:flex;align-items:center;gap:9px;cursor:pointer}
.insts button i{width:10px;height:10px;border-radius:50%;background:var(--ic)}
.insts button small{font-weight:500;color:var(--muted);font-size:12px}
.insts button.on{background:#2A0A6B;border-color:var(--v2)}
.insts .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.kpi{padding:16px 18px}
.kpi .v{font-size:28px;font-weight:600;line-height:1.15;margin:4px 0 2px;font-family:"JetBrains Mono",monospace}
.kpi .l{color:var(--muted);font-size:12px}.kpi .s{color:var(--muted2);font-size:12px}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}@media(max-width:1000px){.grid3{grid-template-columns:1fr}}
.ai-st{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ai-st div{padding:12px 14px;border-radius:14px;background:var(--glass2)}
.ai-st b{display:block;font-family:"JetBrains Mono",monospace;font-size:22px}.ai-st span{font-size:12px;color:var(--muted)}
.feed{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.ev{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;padding:8px 6px;border-radius:10px}
.ev:hover{background:var(--glass2)}
.ev .i{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;background:rgba(100,17,232,.35);color:#E0D2FF}
.ev .i.m{background:rgba(25,224,208,.16);color:#5FF0E3}
.ev .t{font-size:13px}.ev .t span{color:var(--muted)}.ev time{color:var(--muted2);font-size:11px;white-space:nowrap}
.bar{display:grid;grid-template-columns:150px 1fr 38px;gap:12px;align-items:center;margin:9px 0}
.bar .k{color:#D9CCFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.bar .t{height:8px;background:#241A4A;border-radius:6px;overflow:hidden}
.bar .f{height:100%;border-radius:6px;background:var(--v2);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar .n{text-align:right;font-weight:600;font-family:"JetBrains Mono",monospace}
.fn{display:grid;grid-template-columns:150px minmax(0,1fr) 52px 90px;gap:12px;align-items:center;margin:7px 0}
.fn .k{font-size:13px;color:#D9CCFF}.fn .t{height:24px;border-radius:8px;background:var(--glass2);overflow:hidden}
.fn .f{height:100%;border-radius:8px;background:var(--v);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.fn .n{text-align:right;font-family:"JetBrains Mono",monospace;font-weight:600}.fn .r{text-align:right;font-size:12px;color:var(--muted)}.fn .r.low{color:var(--warn);font-weight:600}
.og{margin:10px 0}.og .h{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:5px}.og .h span{color:#D9CCFF}.og .h b{font-family:"JetBrains Mono",monospace}.og .h em{font-style:normal;color:#5FF0E3;font-weight:700}
.og .t{height:8px;border-radius:999px;background:#241A4A;overflow:hidden}.og .f{height:100%;border-radius:999px;background:var(--v2)}
.wk{height:170px;display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line);padding:0 4px}
.wk div{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.wk i{display:block;width:40%;max-width:20px;border-radius:6px 6px 0 0;min-height:2px}
.wk-l{display:flex;gap:12px;padding:6px 4px 0}.wk-l span{flex:1;text-align:center;font-size:11px;color:var(--muted2)}
.lg{display:flex;gap:14px;font-size:12px;color:var(--muted)}.lg span{display:flex;align-items:center;gap:6px}.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.alert{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.alert:last-child{border:0}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;background:var(--glass2);border:1px solid var(--line)}
.p-thalia{color:#FFD38A;border-color:rgba(255,181,71,.45);background:rgba(255,181,71,.1)}.p-conversando{color:#C4A8FF;border-color:rgba(163,123,255,.45);background:rgba(163,123,255,.1)}
.p-pix{color:#FFC9A0;border-color:rgba(255,154,61,.5);background:rgba(255,154,61,.12)}.p-encerrado{color:#B3A9D6}.p-sem_resposta{color:#FFB3C2;border-color:rgba(255,122,150,.45)}
.p-matriculado{color:#5FF0E3;border-color:rgba(25,224,208,.5);background:rgba(25,224,208,.1)}.p-perdido{color:#FFB3C2;border-color:rgba(255,122,150,.45);background:rgba(255,122,150,.08)}
.p-pix_enviado{color:#FFC9A0;border-color:rgba(255,154,61,.5)}.p-comprovante{color:#5FF0E3;border-color:rgba(25,224,208,.5);background:rgba(25,224,208,.08)}
.p-quente{color:#FFB3D6;border-color:rgba(255,122,184,.45)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{font:inherit;padding:9px 12px;border:1px solid rgba(163,123,255,.25);border-radius:11px;background:#120C29;color:var(--ink);outline:none}
input:focus,select:focus{border-color:var(--v2);box-shadow:0 0 0 3px rgba(163,123,255,.25)}input{flex:1;min-width:200px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
tr.r{cursor:pointer}tr.r:hover td{background:rgba(163,123,255,.07)}
.tbl{overflow-x:auto}.muted{color:var(--muted)}.empty{color:var(--muted);padding:12px 2px}
a{color:#C4A8FF}
.kb{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.kb,.kb-top{scrollbar-width:auto;scrollbar-color:#A37BFF rgba(255,255,255,.08)}
.kb::-webkit-scrollbar,.kb-top::-webkit-scrollbar{height:12px}
.kb::-webkit-scrollbar-track,.kb-top::-webkit-scrollbar-track{background:rgba(255,255,255,.06);border-radius:999px}
.kb::-webkit-scrollbar-thumb,.kb-top::-webkit-scrollbar-thumb{background:#6411E8;border-radius:999px;border:2px solid #120C29}
.kb-nav{position:relative;z-index:6;display:flex;align-items:center;gap:10px;margin:0 0 10px;padding:8px 10px;border-radius:14px;background:rgba(18,12,41,.94);border:1px solid var(--line)}
.kb-nav button{flex:none;width:34px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--glass2);color:var(--ink);font-size:15px;cursor:pointer}
.kb-nav button:hover{border-color:var(--v2);color:var(--v2)}
.kb-top{flex:1;overflow-x:auto;overflow-y:hidden;height:16px}
.kb-top div{height:1px}
.col{min-width:250px;width:250px;flex-shrink:0;border-radius:16px;padding:12px;background:var(--bg2);border:1px solid rgba(163,123,255,.12)}
.col.over{border-color:var(--v2);box-shadow:0 0 0 2px rgba(163,123,255,.35) inset}
.col h3{font-size:13px;margin:2px 4px 12px;display:flex;justify-content:space-between;align-items:center}
.col h3 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;background:var(--cc,var(--v))}
.kc{background:#1A1238;border:1px solid rgba(163,123,255,.14);border-left:3px solid var(--ic,var(--v2));border-radius:12px;padding:10px 12px;margin-bottom:9px;cursor:grab;transition:transform .15s,border-color .15s}
.kc:hover{transform:translateY(-2px);border-color:rgba(163,123,255,.5)}
.kc.amarelo{border-color:rgba(255,181,71,.6)}.kc.vermelho{border-color:rgba(255,122,150,.7)}
.nv{position:relative;display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;line-height:1;padding:4px 9px;border-radius:999px;color:var(--nc);background:color-mix(in srgb,var(--nc) 15%,transparent);border:1px solid color-mix(in srgb,var(--nc) 55%,transparent);margin:0 0 8px;white-space:nowrap}
.nv.sug{border-style:dashed}
td .nv{margin-bottom:6px}
.metas{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.meta{display:grid;gap:12px;border-top:3px solid var(--ic)}
.meta .ih{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.meta .ih span{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--ic)}.meta .ih b{display:block;font-size:15px}
.meta .ih small{font-size:12px;color:var(--muted);text-align:right}
.mt{display:grid;gap:6px;font-size:12.5px}
.mt-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}.mt-h .num b{font-size:20px}.mt-h .num{color:var(--muted2)}.mt-h .num b{color:#fff}
.mt-bar{position:relative;height:10px;border-radius:999px;background:#241A4A;overflow:visible}
.mt-bar>div{height:100%;border-radius:999px;min-width:4px;background:var(--ic)}
.mt-bar i{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff;opacity:.7;border-radius:2px}
.mt-ft{display:flex;justify-content:space-between;gap:8px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.mt-ft b{color:var(--warn)}.mt-ft b.ok{color:#5FF0E3}
.mt-nota{margin:0;font-size:11.5px;color:var(--muted2)}
.meta.vazia{align-content:start}.meta.vazia p{margin:0;color:var(--muted);font-size:13px}
.kc b{display:block;font-size:13px}.kc .muted{font-size:12px}.kc .by{font-size:11px;margin-top:4px;color:var(--muted2)}
.drawer{position:fixed;inset:0;background:rgba(5,2,14,.65);backdrop-filter:blur(3px);display:none;z-index:40}.drawer.on{display:block}
.panel{position:absolute;right:0;top:0;bottom:0;width:min(580px,100%);background:#120C29;border-left:1px solid var(--line);overflow:auto;padding:22px}
.msg{max-width:86%;padding:9px 13px;border-radius:14px;margin:7px 0;white-space:pre-wrap;font-size:13px}
.msg.l{background:var(--glass2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a{margin-left:auto;background:var(--v);border-bottom-right-radius:4px}
.msg small{display:block;opacity:.7;font-size:10.5px;margin-top:3px}
.btn{border:0;border-radius:11px;padding:9px 14px;cursor:pointer;font:700 13px "Plus Jakarta Sans",sans-serif;color:#fff;background:var(--v)}
.btn:hover{background:#7426F0}
.btn.ghost{background:var(--glass2);border:1px solid var(--line);font-weight:600}
.mv{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
#geral{display:grid;gap:18px}
footer{color:var(--muted2);text-align:center;font-size:12px;padding:6px 0 30px}
@media(max-width:700px){header{position:relative}#per{flex-wrap:wrap}#per button{padding:8px 10px}.bar{grid-template-columns:110px 1fr 30px}.fn{grid-template-columns:100px minmax(0,1fr) 40px}.fn .r{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wt a,.wt span,.wt button{color:var(--muted);text-decoration:none;font:inherit;font-size:12px;padding:6px 10px;background:none;border:0;cursor:pointer}.wt a:hover,.wt button:hover{color:var(--ink)}.wt form{margin:0}
</style>
</head>

// mantendo a aba, a visão e a rolagem. Espera enquanto alguém está mexendo (ficha ou janela aberta,
// digitando, arrastando um card ou interagiu há menos de 15 s).
let mexeuEm=0;
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{mexeuEm=Date.now()},{passive:true}));
const ocupado=()=>document.hidden||arrasto||document.querySelector('#dw.on')||document.querySelector('#perPop.on')||document.querySelector('.cx-bg.on')||document.activeElement.matches('input,select,textarea')||Date.now()-mexeuEm<15000;
async function atualiza(){
  if(ocupado())return;
  try{
    const r=await fetch('/aura/dados',{cache:'no-store'});
    if(r.status===401){location.href='/login';return}
    const j=await r.json();if(!j.ok||ocupado())return;
    D.leads=j.leads;D.conversas=j.conversas;D.movimentos=j.movimentos;D.instrucoes=j.instrucoes;D.teste=j.teste||[];D.gerado=j.gerado;
    todos=D.leads.filter(l=>l.numero&&!D.teste.includes(l.numero));porNum=Object.fromEntries(todos.map(l=>[l.numero,l]));
    const kb=$('#kb'),x=kb.scrollLeft,y=scrollY;
    render();kb.scrollLeft=x;scrollTo(0,y);rodape();
  }catch(e){console.warn('Central: não consegui atualizar agora',e)}
}
setInterval(atualiza,60000);
}
</script>
</body>
</html>
